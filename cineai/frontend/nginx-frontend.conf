# Nginx config for the containerised frontend (serves static files,
# proxies /api/* to the backend container)
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA — all non-file routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend service
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;

        # SSE-specific headers — must disable buffering
        proxy_buffering          off;
        proxy_cache              off;
        proxy_set_header Connection          '';
        proxy_set_header X-Accel-Buffering   no;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        # Forward the client IP the host nginx already validated (set from its
        # real_ip-resolved $remote_addr). The backend trusts this header, so it
        # must come from the trusted proxy chain, never from the original client.
        proxy_set_header CF-Connecting-IP   $http_cf_connecting_ip;

        # Long timeouts for SSE streams
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
    }

    # MCP server (backend src/mcp_server.py): /mcp public tools, /mcp/agent OAuth,
    # and the RFC 9728 metadata clients use to discover the authorization server.
    # The backend enforces Host/Origin, rate limits, body size and auth itself.
    location ~ ^/(mcp(/agent)?|\.well-known/oauth-protected-resource/mcp/agent)$ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_buffering          off;
        proxy_set_header Connection          '';
        proxy_set_header Host               $host;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP   $http_cf_connecting_ip;
        client_max_body_size 64k;
        proxy_read_timeout  120s;
    }
}
